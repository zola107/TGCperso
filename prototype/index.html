<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosterium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Cinzel:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Space+Mono:wght@400;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Style et mode appliqués avant l'affichage (pas de flash). Sans choix enregistré,
    // le mode suit le réglage de l'appareil.
    (function () {
      var d = document.documentElement, s = "neon", m = "";
      try { s = localStorage.getItem("rosterium-style") || s; m = localStorage.getItem("rosterium-mode") || ""; } catch (e) {}
      d.dataset.style = s;
      d.dataset.mode = m || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    })();
  </script>
</head>
<body>
  <div class="shell">
    <!-- Barre latérale (ordinateur) / barre du haut + dock (mobile) -->
    <aside class="side">
      <a class="brand" href="#hub" aria-label="Rosterium, accueil">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span class="brand-name">Rosterium</span>
      </a>

      <nav class="nav" id="nav" aria-label="Navigation principale">
        <a href="#hub" data-v="hub"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Hub</span></a>
        <a href="#defis" data-v="defis"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 20 4M16.5 4H20v3.5" class="cut"/></svg><span>Défis</span><b class="dot" id="nav-defis" hidden></b></a>
        <a href="#boutique" data-v="boutique"><svg viewBox="0 0 24 24"><path d="M6 3h12l1 4H5zM5 8h14v13H5z"/><path d="M9 8v4a3 3 0 0 0 6 0V8" class="cut"/></svg><span>Boutique</span><b class="dot" id="nav-free" hidden></b></a>
        <a href="#classeur" data-v="classeur"><svg viewBox="0 0 24 24"><path d="M4 3h16v18H4z"/><path d="M8 7h3v4H8zM13 7h3v4h-3zM8 13h3v4H8zM13 13h3v4h-3z" class="cut"/></svg><span>Classeur</span></a>
        <a href="#codex" data-v="codex"><svg viewBox="0 0 24 24"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z"/><path d="M8 18h11M9 7h6M9 10.5h6" class="cut"/></svg><span>Codex</span></a>
        <a href="#marche" data-v="marche"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V12h3v8M10.5 20V7h3v13M16 20v-5h3v5"/></svg><span>Marché</span></a>
      </nav>

      <div class="wallet" id="wallet"></div>

      <div class="prefs">
        <button class="icon-btn" id="style-btn" aria-haspopup="true" aria-expanded="false" aria-controls="style-menu" title="Changer de style" aria-label="Changer de style">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4-4-7.4-9-7.4z"/><circle cx="7.5" cy="10.5" r="1.2" fill="currentColor"/><circle cx="10.5" cy="6.8" r="1.2" fill="currentColor"/><circle cx="15" cy="7.2" r="1.2" fill="currentColor"/></svg>
          <span class="prefs-label">Style</span>
        </button>
        <button class="icon-btn" id="mode-btn"></button>
        <div class="style-menu" id="style-menu" role="menu" hidden></div>
      </div>
    </aside>

    <main id="main">
      <section id="hub" class="view"></section>
      <section id="defis" class="view" hidden></section>
      <section id="boutique" class="view" hidden></section>
      <section id="classeur" class="view" hidden></section>
      <section id="codex" class="view" hidden></section>
      <section id="marche" class="view" hidden></section>
    </main>
  </div>

  <div class="modal" id="modal" hidden></div>
  <div class="stage" id="stage" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="emblems.js"></script>
  <!-- copies locales des images (facultatif, généré par scripts/cache_images.py) -->
  <script src="images/index.js"></script>
  <script src="script.js"></script>
</body>
</html>
