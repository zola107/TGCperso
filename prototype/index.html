<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosterium · croquis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Press+Start+2P&family=Sora:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Style et mode appliqués avant l'affichage (pas de flash). Sans choix enregistré,
    // le mode suit le réglage de l'appareil.
    (function () {
      var d = document.documentElement, s = "neon", m = "";
      try { s = localStorage.getItem("rosterium-style") || s; m = localStorage.getItem("rosterium-mode") || ""; } catch (e) {}
      d.dataset.style = s;
      d.dataset.mode = m || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    })();
  </script>
</head>
<body>
  <header class="top">
    <a class="logo" href="#accueil"><span class="logo-card"></span>Rosterium</a>
    <nav class="nav" id="nav">
      <a href="#accueil" data-v="accueil">Accueil</a>
      <a href="#explorer" data-v="explorer">Explorer</a>
      <a href="#packs" data-v="packs">Packs</a>
      <a href="#collection" data-v="collection">Collection</a>
      <a href="#marche" data-v="marche">Marché</a>
    </nav>
    <div class="hud" id="hud"></div>
    <div class="prefs">
      <button class="icon-btn" id="style-btn" aria-haspopup="true" aria-expanded="false" aria-controls="style-menu" title="Changer de style" aria-label="Changer de style">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4-4-7.4-9-7.4z"/><circle cx="7.5" cy="10.5" r="1.2" fill="currentColor"/><circle cx="10.5" cy="6.8" r="1.2" fill="currentColor"/><circle cx="15" cy="7.2" r="1.2" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="mode-btn"></button>
      <div class="style-menu" id="style-menu" role="menu" hidden></div>
    </div>
  </header>

  <main>
    <section id="accueil" class="view"></section>

    <section id="explorer" class="view" hidden>
      <h1>Explorer les personnages</h1>
      <div class="filters">
        <input id="q" type="search" placeholder="Rechercher un nom, un alias, une franchise" aria-label="Rechercher">
        <select id="f-franchise" aria-label="Franchise"></select>
        <select id="f-theme" aria-label="Thème"></select>
        <select id="f-rarete" aria-label="Rareté"></select>
        <select id="f-tri" aria-label="Tri">
          <option value="az">Ordre alphabétique</option>
          <option value="rarete">Rareté décroissante</option>
          <option value="annee">Plus anciens d'abord</option>
        </select>
      </div>
      <p class="count" id="count"></p>
      <div class="grid" id="grid-explorer"></div>
    </section>

    <section id="packs" class="view" hidden></section>

    <section id="collection" class="view" hidden>
      <h1>Ma collection</h1>
      <div class="progress-big" id="progress"></div>
      <div class="filters">
        <select id="c-rarete" aria-label="Rareté"></select>
        <select id="c-statut" aria-label="Statut">
          <option value="tous">Toutes les cartes</option>
          <option value="possedees">Possédées</option>
          <option value="manquantes">Manquantes</option>
          <option value="doublons">Doublons</option>
        </select>
        <button id="sell-dups" class="btn ghost">Vente rapide des doublons</button>
      </div>
      <div class="grid" id="grid-collection"></div>
    </section>

    <section id="marche" class="view" hidden></section>
  </main>

  <div class="modal" id="modal" hidden></div>
  <div class="stage" id="stage" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
